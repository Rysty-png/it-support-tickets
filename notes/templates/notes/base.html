{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Study Notes{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'notes:list' %}">Study Notes</a></h1>
        <nav>
            {% if user.is_authenticated %}Signed in as {{ user.username }} &middot; {% endif %}
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>
    <main>
        {% for message in messages %}
            <p class="flash {{ message.tags }}">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
